services:
  # ─── FastAPI Backend ───────────────────────────────────────────────────────
  - type: web
    name: resume-screening-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        value: resumeai2024secretkey256bit
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: ADMIN_EMAIL
        value: admin@resumeai.com
      - key: ADMIN_PASSWORD
        value: admin123
      - key: DEMO_USER_EMAIL
        value: demo@resumeai.com
      - key: DEMO_USER_PASSWORD
        value: demo123
      - key: GROQ_API_KEY
        value: ""   # Add your key from console.groq.com

  # ─── React Frontend ────────────────────────────────────────────────────────
  - type: web
    name: resume-screening-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://resume-screening-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
