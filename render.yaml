services:
  # Single server — FastAPI serves both API and React frontend
  - type: web
    name: resume-screening-system
    runtime: python
    buildCommand: >
      pip install -r backend/requirements.txt &&
      cd frontend && npm install && npm run build &&
      cd .. && mkdir -p backend/static &&
      cp -r frontend/dist/. backend/static/
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        value: resumeai2024secretkey256bit
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: ADMIN_EMAIL
        value: admin@resumeai.com
      - key: ADMIN_PASSWORD
        value: admin123
      - key: DEMO_USER_EMAIL
        value: demo@resumeai.com
      - key: DEMO_USER_PASSWORD
        value: demo123
      - key: GROQ_API_KEY
        value: ""
